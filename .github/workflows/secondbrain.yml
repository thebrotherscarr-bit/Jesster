name: secondbrain

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - smith/**
    paths:
      - secondbrain/**
      - .github/workflows/secondbrain.yml
  pull_request:
    paths:
      - secondbrain/**
      - .github/workflows/secondbrain.yml

jobs:
  verify:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: secondbrain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: secondbrain/.nvmrc
      # vite@8 vs tsx's esbuild peer pin needs --legacy-peer-deps (see secondbrain/README.md)
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
