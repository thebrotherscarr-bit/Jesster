name: secondbrain

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - smith/**
    paths:
      - secondbrain/**
      - .github/workflows/secondbrain.yml
  pull_request:
    paths:
      - secondbrain/**
      - .github/workflows/secondbrain.yml

jobs:
  verify:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: secondbrain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: secondbrain/.nvmrc
      # vite@8 vs tsx's esbuild peer pin needs --legacy-peer-deps (see secondbrain/README.md)
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
