name: prove-updater

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - smith/**
  pull_request:

jobs:
  prove:
    # The check names "prove (ubuntu-latest)" and "prove (windows-latest)" are
    # required by main's ruleset: os stays the name, runner is the pinned image
    # (what -latest resolved to on 2026-11-04). Python is per image: 3.12.16
    # has no Windows build, 3.12.10 none for Ubuntu 26.04.
    name: prove (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            runner: ubuntu-26.04
            python: "3.12.16"
          - os: windows-latest
            runner: windows-2025-vs2026
            python: "3.12.10"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Prove the repo updater
        run: python repo-updater/prove_repo_update.py
      - name: Prove the notes microkernel
        run: python notes/prove_notes.py
