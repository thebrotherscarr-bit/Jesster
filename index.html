<!doctype html>
<!-- =====================================================================
  MANJUEL.US — Cloudflare Pages frontend
  One file. No frameworks, no external assets, no build step, no storage.
  It reads the chain from the estate's read-only API and renders it.
  If the estate is offline, it says so plainly. It can write nothing.

  CONFIG: the one line below is the only thing to ever edit here.
  (For testing, ?api=http://host:port overrides it for that visit only.)
====================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>manjuel.us — the hash-chained ledger</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background:#0d1117; color:#e6edf3; font:15px/1.5 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
a { color:#58a6ff; text-decoration:none; cursor:pointer; } a:hover { text-decoration:underline; }
.top { background:#010409; border-bottom:1px solid #30363d; padding:14px 24px; display:flex; align-items:baseline; gap:14px; }
.top .brand { font-weight:700; font-size:17px; color:#e6edf3; letter-spacing:.4px; }
.top .sub { color:#8b949e; font-size:13px; }
.top .nav { margin-left:auto; font-size:14px; display:flex; gap:18px; }
.wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
.stats { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
.stat { background:#161b22; border:1px solid #30363d; border-radius:6px; padding:10px 16px; }
.stat .k { color:#8b949e; font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
.stat .v { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px; margin-top:2px; }
.box { background:#161b22; border:1px solid #30363d; border-radius:6px; overflow:hidden; }
.row { display:flex; gap:14px; align-items:baseline; padding:11px 16px; border-top:1px solid #21262d; }
.row:first-child { border-top:none; }
.row .action { font-weight:600; min-width:0; overflow-wrap:anywhere; }
.row .actor { color:#8b949e; font-size:13px; }
.row .ts { color:#8b949e; font-size:13px; margin-left:auto; white-space:nowrap; }
.row .hash { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; background:#0d1117; border:1px solid #30363d; border-radius:4px; padding:1px 8px; white-space:nowrap; }
.kv { padding:10px 16px; border-top:1px solid #21262d; display:flex; gap:14px; }
.kv:first-child { border-top:none; }
.kv .k { color:#8b949e; width:110px; flex:none; font-size:13px; padding-top:1px; }
.kv .v { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13.5px; overflow-wrap:anywhere; }
pre.payload { background:#0d1117; border:1px solid #30363d; border-radius:6px; padding:12px 14px; font-size:13px; overflow-x:auto; margin:4px 0 0; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
.ok { color:#3fb950; font-weight:600; } .bad { color:#f85149; font-weight:600; }
.note { color:#8b949e; font-size:13px; margin:16px 2px; }
.pager { margin-top:16px; display:flex; gap:10px; }
.pager a, .pager span.off { border:1px solid #30363d; border-radius:6px; padding:5px 14px; font-size:13px; }
.pager span.off { color:#484f58; }
h2 { font-size:16px; margin: 0 0 12px; font-weight:600; }
.genesis-tag { color:#d29922; font-size:12px; border:1px solid #d29922; border-radius:10px; padding:0 8px; white-space:nowrap; }
.offline { background:#161b22; border:1px solid #f85149; border-radius:6px; padding:20px 24px; }
.offline .t { color:#f85149; font-weight:700; margin-bottom:6px; }
.offline .d { color:#8b949e; font-size:14px; }
.loading { color:#8b949e; padding:24px 2px; }
footer { color:#484f58; font-size:12.5px; text-align:center; padding:28px 0 20px; }
</style>
</head>
<body>
<div class="top">
  <span class="brand">MANJUEL.US</span>
  <span class="sub">the hash-chained ledger</span>
  <span class="nav"><a href="#/">chain</a> <a href="#/verify">verify</a></span>
</div>
<div class="wrap" id="main"><div class="loading">Reaching the estate…</div></div>
<footer>No files are hosted here. Only the chain.<br>
Authenticity is verifiable only by the operator and those given the cypher.</footer>

<script>
"use strict";

/* ===== CONFIG — the one line to edit ===== */
const API_BASE = "https://api.manjuel.us";
/* ========================================= */

const api = new URLSearchParams(location.search).get("api") || API_BASE;
const PAGE = 50;
const main = document.getElementById("main");
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short = h => h.slice(0, 12);

async function get(path) {
  const r = await fetch(api + path, { method: "GET", mode: "cors" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function offline(err) {
  main.innerHTML =
    "<div class='offline'><div class='t'>The estate is unreachable.</div>" +
    "<div class='d'>The chain itself is unharmed — it lives on the operator's machine, " +
    "and this page can neither read it right now nor ever write to it.<br>" +
    "(" + esc(err.message) + " from " + esc(api) + ")</div></div>";
}

function rowHtml(e) {
  const tag = e.seq === 1 ? " <span class='genesis-tag'>block zero</span>" : "";
  return "<div class='row'>" +
    "<span class='action'>" + esc(e.action) + tag + "</span>" +
    "<span class='actor'>by " + esc(e.actor) + " · seq " + e.seq + "</span>" +
    "<span class='ts'>" + esc(e.ts) + "</span>" +
    "<a class='hash' href='#/e/" + e.entry_hash + "'>" + short(e.entry_hash) + "</a>" +
    "</div>";
}

async function viewChain(page) {
  main.innerHTML = "<div class='loading'>Reading the chain…</div>";
  const head = await get("/api/head");
  const total = head.entries;
  const hi = total - page * PAGE;              // newest seq on this page
  const lo = Math.max(0, hi - PAGE);           // fetch entries with seq > lo
  const chain = hi > 0 ? await get("/api/chain?after_seq=" + lo + "&limit=" + PAGE) : { entries: [] };
  const rows = chain.entries.filter(e => e.seq <= hi).reverse();
  const genesis = total ? await get("/api/chain?after_seq=0&limit=1") : null;
  const g = genesis && genesis.entries[0];
  const stats =
    "<div class='stats'>" +
    "<div class='stat'><div class='k'>entries</div><div class='v'>" + total + "</div></div>" +
    (g ? "<div class='stat'><div class='k'>genesis</div><div class='v'><a href='#/e/" + g.entry_hash + "'>" + short(g.entry_hash) + "…</a></div></div>" : "") +
    (head.head ? "<div class='stat'><div class='k'>head</div><div class='v'><a href='#/e/" + head.head.entry_hash + "'>" + short(head.head.entry_hash) + "…</a></div></div>" : "") +
    "<div class='stat'><div class='k'>protocol</div><div class='v'>" + esc(head.protocol || "—") + "</div></div>" +
    "</div>";
  const newer = page > 0 ? "<a href='#/p/" + (page - 1) + "'>newer</a>" : "<span class='off'>newer</span>";
  const older = lo > 0 ? "<a href='#/p/" + (page + 1) + "'>older</a>" : "<span class='off'>older</span>";
  main.innerHTML = stats + "<h2>The chain</h2>" +
    "<div class='box'>" + (rows.map(rowHtml).join("") || "<div class='row'>empty</div>") + "</div>" +
    "<div class='pager'>" + newer + older + "</div>";
}

async function viewEntry(hash) {
  main.innerHTML = "<div class='loading'>Reading entry…</div>";
  const e = await get("/api/entry/" + hash);
  if (e.error) { main.innerHTML = "<h2>Not on the chain</h2><p class='note'><a href='#/'>Back to the chain.</a></p>"; return; }
  const zero = "0".repeat(64);
  const parent = e.parent_hash === zero
    ? esc(e.parent_hash) + " (nothing before block zero)"
    : "<a href='#/e/" + e.parent_hash + "'>" + e.parent_hash + "</a>";
  let payload = e.payload;
  try { payload = JSON.stringify(JSON.parse(payload), null, 2); } catch (_) {}
  main.innerHTML =
    "<h2>Entry seq " + e.seq + "</h2><div class='box'>" +
    "<div class='kv'><span class='k'>entry hash</span><span class='v'>" + esc(e.entry_hash) + "</span></div>" +
    "<div class='kv'><span class='k'>parent</span><span class='v'>" + parent + "</span></div>" +
    "<div class='kv'><span class='k'>timestamp</span><span class='v'>" + esc(e.ts) + "</span></div>" +
    "<div class='kv'><span class='k'>actor</span><span class='v'>" + esc(e.actor) + "</span></div>" +
    "<div class='kv'><span class='k'>action</span><span class='v'>" + esc(e.action) + "</span></div>" +
    "<div class='kv'><span class='k'>seal</span><span class='v'>" + esc(e.seal) + "</span></div>" +
    "</div>" +
    "<p class='note'>The seal is a keyed BLAKE3 digest. It can be recomputed — and therefore verified — " +
    "only with the cypher, which is held on paper and was never stored.</p>" +
    "<h2>Payload</h2><pre class='payload'>" + (payload ? esc(payload) : "(empty)") + "</pre>";
}

async function viewVerify() {
  main.innerHTML = "<div class='loading'>Asking the estate to walk its chain…</div>";
  const rep = await get("/api/verify");
  const status = rep.intact
    ? "<span class='ok'>INTACT</span> — every link and every entry hash verifies."
    : "<span class='bad'>BROKEN</span> — the chain does not verify.";
  const breaks = (rep.breaks || []).map(b =>
    "<div class='kv'><span class='k'>seq " + b.seq + "</span><span class='v'>" + esc(b.fault) + "</span></div>").join("");
  main.innerHTML =
    "<h2>Public verification — run on the estate, just now</h2>" +
    "<div class='box'>" +
    "<div class='kv'><span class='k'>entries</span><span class='v'>" + rep.entries + "</span></div>" +
    "<div class='kv'><span class='k'>chain</span><span class='v'>" + status + "</span></div>" +
    "<div class='kv'><span class='k'>head</span><span class='v'>" + esc(rep.head || "—") + "</span></div>" +
    breaks + "</div>" +
    "<p class='note'>This proves integrity: nothing was altered or reordered after being recorded. " +
    "It does not prove authenticity — the genesis hash and the per-entry seals derive from a cypher " +
    "that exists only on paper. Verification of authorship belongs to the operator, and to whoever " +
    "the operator hands the paper.</p>";
}

async function route() {
  const h = location.hash || "#/";
  try {
    let m;
    if ((m = h.match(/^#\/e\/([0-9a-f]{64})$/))) await viewEntry(m[1]);
    else if (h === "#/verify") await viewVerify();
    else if ((m = h.match(/^#\/p\/(\d+)$/))) await viewChain(Math.max(0, parseInt(m[1], 10)));
    else await viewChain(0);
  } catch (err) {
    offline(err);
  }
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
